server {
    listen 80;
    listen [::]:80;
    server_name studio.crypto-compass-web.online;
    include /www/server/panel/vhost/nginx/crypto-compass-acme-location.inc;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name studio.crypto-compass-web.online;
    ssl_certificate /www/server/panel/vhost/cert/crypto-compass-web.online-shared/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/crypto-compass-web.online-shared/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:studio_ssl:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Keep auth/reset query tokens out of access logs.
    access_log off;
    error_log /www/wwwlogs/studio.error.log warn;
    include /www/server/panel/vhost/nginx/crypto-compass-acme-location.inc;
    # Stream valid requests to the application's authenticated resource checks.
    client_max_body_size 0;
    client_body_timeout 900s;
    location = / { return 302 /admin/; }
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx is the edge; overwrite client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
